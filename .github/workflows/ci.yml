name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
    inputs:
      export_image:
        description: Export the tested image for the delivery workflow
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ai-goofish-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.14"
          enable-cache: true
      - name: Run hermetic Python tests
        run: uv run --no-project --python 3.11 --with-requirements requirements.txt pytest -m 'not live' -q

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web-ui
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - run: npm ci --no-fund
      - run: npm run build

  image:
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    env:
      IMAGE: ai-goofish-monitor:tested
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build the release image tested by this run
        run: |
          docker build \
            --file Dockerfile.release \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --build-arg SOURCE_URL="https://github.com/$GITHUB_REPOSITORY" \
            --tag "$IMAGE" \
            .
      - name: Verify immutable image provenance labels
        run: |
          test "$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
          test "$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.source" }}')" = "https://github.com/$GITHUB_REPOSITORY"
      - name: Validate NAS Compose template
        run: |
          cp .env.example infra/nas/.env
          printf 'AIGOOFISH_IMAGE=ghcr.io/colorlesscube/ai-goofish-monitor@sha256:%064d\n' 0 > /tmp/.env.images
          docker compose -f infra/nas/compose.yaml --env-file /tmp/.env.images config --quiet
      - name: Export the exact tested image
        if: ${{ inputs.export_image == true }}
        run: |
          mkdir -p /tmp/ai-goofish-release
          docker image save "$IMAGE" | gzip > /tmp/ai-goofish-release/image.tar.gz
      - name: Upload tested image
        if: ${{ inputs.export_image == true }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tested-image-${{ github.sha }}
          path: /tmp/ai-goofish-release/image.tar.gz
          retention-days: 2
          compression-level: 0
          if-no-files-found: error
