services:
  app:
    image: ${AIGOOFISH_IMAGE:?Set the immutable image digest in .env.images}
    platform: linux/amd64
    container_name: ai-goofish-monitor-app
    init: true
    ports:
      - "${AIGOOFISH_BIND_ADDRESS:-0.0.0.0}:${AIGOOFISH_PORT:-8567}:8000"
    env_file:
      - .env
    environment:
      APP_DATABASE_FILE: /app/data/app.sqlite3
    volumes:
      - ./.env:/app/.env:ro
      - ./data:/app/data
      - ./state:/app/state
      - ./config.json:/app/config.json
      - ./prompts:/app/prompts
      - ./jsonl:/app/jsonl
      - ./logs:/app/logs
      - ./images:/app/images
      - ./price_history:/app/price_history
    restart: unless-stopped
